<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#141417"/>
  <g transform="translate(8, 5) scale(0.75)">
    <!-- Camera Body -->
    <rect x="8" y="10" width="48" height="34" rx="9" fill="none" stroke="#f6f3eb" stroke-width="3.5"/>
    <!-- Red shutter indicator -->
    <circle cx="18" cy="20" r="2.5" fill="#ef4444"/>
    <!-- Camera Top Bar -->
    <rect x="36" y="5" width="14" height="6" rx="2" fill="#f6f3eb"/>
    <!-- Top right sparkle -->
    <path d="M 47 10 Q 47 15 52 15 Q 47 15 47 20 Q 47 15 42 15 Q 47 15 47 10 Z" fill="#e5a93c"/>
    <!-- Camera Lens -->
    <circle cx="32" cy="27" r="9" fill="#1b1b20" stroke="#f6f3eb" stroke-width="3.5"/>
    <circle cx="34" cy="25" r="3" fill="#f6f3eb" opacity="0.6"/>
    <!-- Polaroid frame ejecting below -->
    <g transform="translate(14, 32)">
      <!-- Outer Polaroid Frame -->
      <rect x="0" y="0" width="36" height="26" rx="3" fill="#faf8f5" stroke="#e5a93c" stroke-width="1.8"/>
      <!-- Photo Area inside frame -->
      <rect x="3.5" y="3.5" width="29" height="15" rx="1.5" fill="#1a191f"/>
      <!-- Heart in photo -->
      <path d="M 18 14 C 13 10 11 7 13 5 C 14.5 4 16.5 5 18 6.5 C 19.5 5 21.5 4 23 5 C 25 7 23 10 18 14 Z" fill="#f5eedc"/>
    </g>
  </g>
</svg>
